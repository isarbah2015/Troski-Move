kind = "mobile"
previewPath = "/mobile/"
title = "Troski Mobile"
description = "The mobile commuter companion for Troski, bringing trip planning, live journey context, wallet access, bookings, and safety reporting to Android and iOS."
version = "1.0.0"
id = "artifacts/troski-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 23801

[services.development]
run = "pnpm --filter @workspace/troski-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/troski-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/troski-mobile", "run", "serve" ]

[services.env]
PORT = "23801"
BASE_PATH = "/mobile/"
